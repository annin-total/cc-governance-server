<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>{% block title %}集計{% endblock %}</title>
<style>
  body { font-family: sans-serif; margin: 1.5rem; color: #222; }
  nav a { margin-right: 1rem; }
  h2 { margin-top: 2rem; }
  table { border-collapse: collapse; margin: 0.5rem 0 1.5rem; }
  th, td { border: 1px solid #ccc; padding: 0.3rem 0.6rem; text-align: left; }
  .rate-bar { position: relative; width: 200px; height: 1rem; background: #eee; }
  .rate-bar > span { position: absolute; top: 0; left: 0; height: 100%; background: #4a90d9; display: block; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}">概況</a>
  <a href="{{ url_for('policy_view') }}">policy</a>
  <a href="{{ url_for('effect_view') }}">effect</a>
  <a href="{{ url_for('assets_view') }}">assets</a>
</nav>
<h1>{% block heading %}{% endblock %}</h1>
{% block content %}{% endblock %}
</body>
</html>
