{# 丸めた値。当てると正確な値のツールチップを出す（JS が無ければ title）。丸めで失うものが無ければ包まない #}
{% macro exact(shown, full) -%}
{%- if full and full != shown -%}<span class="exact" data-tip="{{ L.EXACT }}  {{ full }}" title="{{ full }}">{{ shown }}</span>
{%- else -%}{{ shown }}{%- endif -%}
{%- endmacro %}

{% macro parts(ps) %}{% for shown, full in ps %}{{ exact(shown, full) }}{% endfor %}{% endmacro %}
