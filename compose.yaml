# ローカル開発用。既定は SQLite で動かす: docker compose up
# MySQL で動かす: dev.env の DB_DSN を MySQL の行に入れ替え、docker compose --profile mysql up
# テストだけ MySQL で流す:
#   docker compose --profile mysql up -d mysql
#   CCGOV_TEST_MYSQL_DSN=mysql://root:dev-root-password@127.0.0.1:13306 .venv/bin/python -m pytest -q
services:
  server:
    build: .
    ports:
      # macOS では 5000 番が AirPlay レシーバーと衝突するため、ホスト側だけ 15000 にする。
      # 127.0.0.1 に限定し、LAN に公開しない。
      - "127.0.0.1:15000:5000"
    volumes:
      - ./dev.env:/mnt/data/secrets/cc-governance-server.env:ro
      - dev_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
        # profile を付けない既定の起動では mysql が無く、SQLite のまま動く
        required: false

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    # 資格情報はダミー。dev.env の MySQL の DB_DSN とそろえる。
    environment:
      MYSQL_ROOT_PASSWORD: dev-root-password
      MYSQL_DATABASE: ccgov
      MYSQL_USER: ccgov
      MYSQL_PASSWORD: dev-db-password
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdev-root-password"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  dev_data:
