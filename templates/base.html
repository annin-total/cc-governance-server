{%- set app_name = "Claude Code 利用状況" -%}
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}集計{% endblock %} · {{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('admin.static', filename='app.css') }}">
</head>
<body>
<header><div class="bar">
  <a class="brand" href="{{ url_for('admin.index') }}">{{ app_name }}</a>
  <nav>
    {%- set here = request.endpoint %}
    <a href="{{ url_for('admin.index') }}"{% if here == 'admin.index' %} aria-current="page"{% endif %}>概況</a>
    <a href="{{ url_for('admin.policy_view') }}"{% if here == 'admin.policy_view' %} aria-current="page"{% endif %}>policy</a>
    <a href="{{ url_for('admin.effect_view') }}"{% if here == 'admin.effect_view' %} aria-current="page"{% endif %}>effect</a>
    <a href="{{ url_for('admin.assets_view') }}"{% if here == 'admin.assets_view' %} aria-current="page"{% endif %}>assets</a>
  </nav>
</div></header>
<main>
<h1>{% block heading %}{% endblock %}</h1>
{% block content %}{% endblock %}
</main>
<footer>
  端末からの自己申告値。コストとトークンは全社 CSV を正とする。
  監査・人事評価・勤怠管理には使わない。
</footer>
</body>
</html>
