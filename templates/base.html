<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}集計{% endblock %} · cc-governance-monitor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header><div class="bar">
  <a class="brand" href="{{ url_for('index') }}">cc-governance-monitor</a>
  <nav>
    {%- set here = request.endpoint %}
    <a href="{{ url_for('index') }}"{% if here == 'index' %} aria-current="page"{% endif %}>概況</a>
    <a href="{{ url_for('policy_view') }}"{% if here == 'policy_view' %} aria-current="page"{% endif %}>policy</a>
    <a href="{{ url_for('effect_view') }}"{% if here == 'effect_view' %} aria-current="page"{% endif %}>effect</a>
    <a href="{{ url_for('assets_view') }}"{% if here == 'assets_view' %} aria-current="page"{% endif %}>assets</a>
  </nav>
</div></header>
<main>
<h1>{% block heading %}{% endblock %}</h1>
{% block content %}{% endblock %}
</main>
<footer>
  端末からの自己申告値。コストとトークンは全社 CSV を正とする。
  監査・人事評価・勤怠管理には使わない。
</footer>
</body>
</html>
